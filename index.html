<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheet Viewer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>Sheet Data</h1>
      <p>Live data from Google Sheets</p>
    </header>

    <div class="table-card">
      <div id="sheet-status" class="status">Loading data...</div>
      <div class="filter-bar" id="filter-bar">
        <input type="text" id="search-input" placeholder="Search all columns..." autocomplete="off" />
        <span id="row-count" class="row-count"></span>
      </div>
      <div id="sheet-container" class="table-wrapper"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
